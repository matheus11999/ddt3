map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 8k;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
 # The map editor uploads the rebuilt terrain art (a few MB); everything else stays tiny.
 location /api/admin/ { client_max_body_size 32m; proxy_pass http://server:4107; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
 location /api/ { proxy_pass http://server:4107; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
 location /ws { proxy_pass http://server:4107; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 65s; proxy_send_timeout 65s; }
 location /assets/ { expires 1h; try_files $uri =404; }
 location = /admin { try_files /admin.html =404; }
 location /admin/ { try_files /admin.html =404; }
 location / { try_files $uri $uri/ /index.html; }
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
}
