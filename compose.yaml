name: brasa
services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.client
    ports: ["127.0.0.1:8097:8080"]
    depends_on:
      server: {condition: service_healthy}
      site: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  server:
    build:
      context: .
      dockerfile: infra/Dockerfile.server
    environment:
      PORT: 4107
      DATABASE_URL: postgres://brasa:${POSTGRES_PASSWORD:-brasa_local}@postgres:5432/brasa
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8097,http://127.0.0.1:8097,http://localhost:5177,http://127.0.0.1:5177}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Site and game share the account cookie: set the parent domain in production (e.g. .bombmasters.com.br).
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Bomb Masters server this game runs (one character per account per server, docs/site.md).
      SERVER_ID: ${SERVER_ID:-s1}
      GAME_URL: ${GAME_URL:-/game}
      MAX_CONNECTIONS: 1000
      BEHIND_PROXY: 'true'
      # Admin panel (/admin): set both in .env; the hash comes from `npm run admin:password`.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4107/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 768m
  # Bomb Masters site (docs/site.md): landing page, accounts shared with the game, player page and forum.
  site:
    build:
      context: .
      dockerfile: infra/Dockerfile.site
    ports: ["127.0.0.1:8098:4120"]
    environment:
      PORT: 4120
      DATABASE_URL: postgres://brasa:${POSTGRES_PASSWORD:-brasa_local}@postgres:5432/brasa
      GAME_URL: ${GAME_URL:-/game}
      ALLOWED_ORIGINS: ${SITE_ORIGINS:-http://localhost:8097,http://127.0.0.1:8097,http://localhost:8098,http://127.0.0.1:8098}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # 'true' only when a reverse proxy sits in front of the site (real visitor address for the login limit).
      BEHIND_PROXY: ${SITE_BEHIND_PROXY:-false}
      # Forum images and videos (site/server/media.ts) live in their own volume.
      UPLOAD_DIR: /data/uploads
    volumes: ["site-uploads:/data/uploads"]
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4120/api/site/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brasa_local}
      POSTGRES_DB: brasa
    volumes: ["brasa-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasa -d brasa"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  brasa-data:
  site-uploads:
